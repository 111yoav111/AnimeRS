name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: AnimeRS-windows-x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: AnimeRS-macos-arm64
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: AnimeRS-macos-x86_64
          - os: ubuntu-22.04     # oldest supported glibc - binaries built on
            label: Linux (x64)   # newer Ubuntu won't run on older distros
            artifact: AnimeRS-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        working-directory: app
        run: pyinstaller --noconfirm AnimeRS.spec

      - name: Package
        shell: bash
        run: |
          cd app/dist
          if [ -f AnimeRS.exe ]; then
            mv AnimeRS.exe "${{ matrix.artifact }}.exe"
            ls -lh "${{ matrix.artifact }}.exe"
          else
            chmod +x AnimeRS
            # zip keeps the executable bit, which a raw artifact upload loses
            zip -9 "${{ matrix.artifact }}.zip" AnimeRS
            ls -lh "${{ matrix.artifact }}.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/dist/${{ matrix.artifact }}.exe
            app/dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
          fi
